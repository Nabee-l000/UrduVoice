name: Build APK
on: [push, workflow_dispatch]

env:
  # Fewer steps = faster speech. 10 = original, 3 = ~3x faster, 2 = fastest
  MATCHA_STEPS: '3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q -o UrduVoice.zip

      - name: Download voice models
        run: |
          mkdir -p UrduVoice/app/src/main/assets
          cd UrduVoice/app/src/main/assets
          curl -fL --retry 3 -o matcha_tts.onnx https://huggingface.co/AhsanTalal/urdu-matcha-tts/resolve/main/matcha_tts.onnx
          curl -fL --retry 3 -o vocab.json https://huggingface.co/AhsanTalal/urdu-matcha-tts/resolve/main/vocab.json
          curl -fL --retry 3 -o vocos-22khz-univ.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/vocoder-models/vocos-22khz-univ.onnx

      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      # Re-export the Urdu model with fewer steps (faster). If this fails,
      # the build still continues with the original 10-step model.
      - name: Make faster model (${{ env.MATCHA_STEPS }} steps)
        id: fast
        continue-on-error: true
        run: |
          pip install -q torch==2.2.2 torchaudio==2.2.2 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "numpy<2" onnx lightning hydra-core omegaconf rich einops conformer==0.3.2 \
            diffusers==0.25.0 "huggingface_hub<0.26" matplotlib gdown wget scipy soundfile
          git clone -q --depth 1 https://github.com/shivammehta25/Matcha-TTS
          # Training-only C extension: not needed for export, replace with a stub
          printf 'def maximum_path_c(*a, **k):\n    raise NotImplementedError\n' > Matcha-TTS/matcha/utils/monotonic_align/core.py
          curl -fL --retry 3 -o matcha_urdu.ckpt https://huggingface.co/AhsanTalal/urdu-matcha-tts/resolve/main/matcha_urdu.ckpt
          cat > export_fast.py <<'EOF'
          import sys, torch
          sys.path.insert(0, "Matcha-TTS")
          from matcha.models.matcha_tts import MatchaTTS
          steps = int(sys.argv[1])
          model = MatchaTTS.load_from_checkpoint("matcha_urdu.ckpt", map_location="cpu").eval()
          print("n_vocab:", model.n_vocab, "| speakers:", model.n_spks, "| steps:", steps)
          def fwd(x, x_lengths, scales):
              out = model.synthesise(x, x_lengths, n_timesteps=steps,
                                     temperature=scales[0], length_scale=scales[1])
              return out["mel"], out["mel_lengths"]
          model.forward = fwd
          x = torch.randint(1, 20, (1, 51), dtype=torch.long)
          torch.onnx.export(model, (x, torch.LongTensor([51]), torch.tensor([0.667, 1.0])),
              "matcha_fast.onnx", opset_version=17,
              input_names=["x", "x_lengths", "scales"], output_names=["mel", "mel_lengths"],
              dynamic_axes={"x": {0: "N", 1: "L"}, "x_lengths": {0: "N"},
                            "mel": {0: "N", 2: "T"}, "mel_lengths": {0: "N"}})
          print("Exported OK")
          EOF
          python export_fast.py $MATCHA_STEPS
          python -c "import onnxruntime" 2>/dev/null || pip install -q onnxruntime
          python - <<'EOF'
          import numpy as np, onnxruntime as ort, time
          s = ort.InferenceSession("matcha_fast.onnx")
          x = np.zeros((1, 41), dtype=np.int64); x[0, 1::2] = 5
          t = time.time()
          mel = s.run(None, {"x": x, "x_lengths": np.array([41]), "scales": np.array([0.667, 1.0], dtype=np.float32)})[0]
          print("Test run OK, mel shape", mel.shape, "in", round((time.time()-t)*1000), "ms")
          EOF
          mv matcha_fast.onnx UrduVoice/app/src/main/assets/matcha_tts.onnx

      - name: Which model is used
        run: |
          echo "Fast model step result: ${{ steps.fast.outcome }}"
          ls -lh UrduVoice/app/src/main/assets

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.7'}

      - name: Build
        working-directory: UrduVoice
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: UrduVoice-apk
          path: UrduVoice/app/build/outputs/apk/release/*.apk
